# Deploys with wrangler, the same command as the README.
#
#   Pull request from a branch in this repo -> preview at pr-<number>.openorbia.pages.dev (the preview database, test Turnstile keys,
#                                              no email). Pull requests from forks never get the Cloudflare token, so they never deploy.
#   Push to main                            -> production, only after Khaja approves it in GitHub (the "production" environment
#                                              must have Khaja as a required reviewer: see SECURITY-SETUP.md).
#
# Tests run first in the same job, so nothing deploys that fails them. Database migrations and seeding stay manual on purpose.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (limited to Cloudflare Pages on the OpenOrbia account) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.156.2

jobs:
  preview:
    name: Preview
    # Not for forks (no secrets, by GitHub's design) and not for Dependabot (it gets no repository secrets either; CI still tests it)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.openorbia.pages.dev
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - name: Deploy the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy --project-name openorbia --branch "pr-${{ github.event.pull_request.number }}"

  production:
    name: Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://openorbia.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never cut a production deploy off halfway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy --project-name openorbia --branch main
