# Weekly source check: re-reads every official page behind the Launch List (data/free-facts.json),
# saves the new snapshots and opens an issue when a pricing line changed or a source link broke.
# See scripts/check-sources.mjs. Scheduled runs only happen from the default branch (main).
name: Weekly source check

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC (7 or 8 AM Pacific)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the official sources
        id: check
        run: node scripts/check-sources.mjs --report "$RUNNER_TEMP/source-check.md"

      - name: Add the report to the run summary
        run: cat "$RUNNER_TEMP/source-check.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when a listing needs a look
        if: steps.check.outputs.needs_look == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Source check $(date -u +%F): ${{ steps.check.outputs.summary }}" --body-file "$RUNNER_TEMP/source-check.md"

      - name: Save the new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots.json
          if git diff --cached --quiet; then echo "No snapshot changes."; exit 0; fi
          git commit -m "Source check $(date -u +%F): update snapshots"
          git push
