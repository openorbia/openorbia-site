name = "openorbia"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "openorbia-db"
database_id = "8f21ec5b-2650-46df-a41f-d5742a59e69b"

# The preview environment (every deployment that is not --branch main, such as the launch-day preview) has its own database, so testing
# votes, clicks and signups there never touches the live data. Production keeps openorbia-db above. The preview's VOTE_SECRET is a
# separate secret: npx wrangler pages secret put VOTE_SECRET --project-name openorbia --env preview
[[env.preview.d1_databases]]
binding = "DB"
database_name = "openorbia-db-preview"
database_id = "a280dab0-fea9-4c09-9194-fba1017788d0"

# The Turnstile site key is public (it is in the page source). The matching secret, TURNSTILE_SECRET_KEY, is set with:
#   npx wrangler pages secret put TURNSTILE_SECRET_KEY --project-name openorbia            (production)
#   npx wrangler pages secret put TURNSTILE_SECRET_KEY --project-name openorbia --env preview
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFs-XgBfIiYO5loz"

# Previews use Cloudflare's official Turnstile TEST keys (always pass; documented at developers.cloudflare.com/turnstile/troubleshooting/testing/),
# so the forms can be tried on any preview host. The test secret is set for the preview environment only.
[env.preview.vars]
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
